name: 'Setup UniGo'
description: 'GitHub Action to install and setup UniGo (Universal Runtime Manager) with auto-detection.'
author: 'Snowdream Tech'
branding:
  icon: 'download'
  color: 'blue'

inputs:
  unigo-version:
    required: false
    default: ''
    description: >-
      The version of unigo to install (e.g. "0.0.1"). If empty, installs
      the latest release.

  github_token:
    required: false
    default: ${{ github.token }}
    description: >-
      GitHub token for API authentication to avoid rate limits when fetching
      release information or downloading from GitHub.

  github_proxy:
    required: false
    default: ''
    description: >-
      Proxy prefix for GitHub download URLs. Set to a mirror URL to speed up
      downloads in restricted networks (e.g. "https://ghproxy.com/").
      Also reads from the GITHUB_PROXY environment variable.

  install_method:
    required: false
    default: 'auto'
    description: >-
      Installation method. One of: auto, npm, pip, release, go.
      - auto: Smart detection based on available runtimes (npm → pip → release → go)
      - npm:  Install via `npm install -g @snowdreamtech/unigo`
      - pip:  Install via `pip install snowdreamtech-unigo`
      - release: Download binary from GitHub Releases
      - go:   Install via `go install github.com/snowdreamtech/unigo@...`

  cache:
    required: false
    default: 'true'
    description: >-
      If true, cache the unigo installation directory to speed up subsequent runs.

  cache_save:
    required: false
    default: 'true'
    description: >-
      If true, save the cache after installation. Set to false to only restore.

  cache_key_prefix:
    required: false
    default: 'setup-unigo-v1'
    description: >-
      Prefix for the cache key. Change this value to invalidate the cache.

  cache_key:
    required: false
    default: ''
    description: |
      Override the complete cache key. Supports Handlebars template variables:
        {{version}}           - The unigo version
        {{cache_key_prefix}}  - The cache key prefix
        {{platform}}          - Platform string (e.g. "linux-x64-ubuntu24")
        {{file_hash}}         - Hash of unigo config files (.unigo.toml, unigo.lock)
        {{unigo_env}}        - Value of UNIGO_ENV environment variable

        {{default}}           - The processed default cache key (for extension)

outputs:
  cache-hit:
    description: 'Whether the cache was restored (true/false).'

  unigo-version:
    description: 'The version of unigo that was installed.'

  install-method:
    description: 'The installation method that was used (npm/pip/release/go).'

runs:
  using: node24
  main: 'dist/index.cjs'
  post: 'dist/post.cjs'
